blank_issues_enabled: true
contact_links:
  - name: Tool behaviour, workflows, or your Writ account
    url: https://usewrit.app/contact/
    about: This connector holds no tool logic. Anything about what a writ_* tool does, or about Writ Cloud itself, goes to Writ support.

  - name: The open-source agent (your own machines)
    url: https://github.com/usewrit/writ-agent/issues
    about: Issues with writ-agent, the program that connects your own computer or server to Writ.

  - name: Report a security vulnerability
    url: https://github.com/usewrit/writ-mcp/security/advisories/new
    about: Please report privately through GitHub Security Advisories — never as a public issue.
